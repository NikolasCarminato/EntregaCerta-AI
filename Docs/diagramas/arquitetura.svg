  <text x="618" y="1136" fill="#19271f" font-family="Arial, sans-serif" font-size="18" font-weight="400">public: histórico/MLP anterior e avaliações originais separadas</text>
  <text x="618" y="1161" fill="#19271f" font-family="Arial, sans-serif" font-size="18" font-weight="400">Volume persistente • porta local 5433 → contêiner 5432</text>
  <rect x="1630" y="1010" width="350" height="210" rx="10" fill="#f0f5ed" stroke="#c7d5c5" stroke-width="1.5" />
  <text x="1648" y="1049" fill="#19271f" font-family="Arial, sans-serif" font-size="21" font-weight="700">Memória do processo</text>
