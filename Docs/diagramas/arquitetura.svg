    <tspan x="65" dy="24.839999999999996">Não há promoção automática de modelo.</tspan>
    <tspan x="65" dy="24.839999999999996">A loja lê o catálogo dos CSVs Olist;</tspan>
    <tspan x="65" dy="24.839999999999996">não gera entradas D−1 operacionais.</tspan>
  </text>
