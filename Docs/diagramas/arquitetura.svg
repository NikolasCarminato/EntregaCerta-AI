  <text x="610" y="884" fill="#50604f" font-family="Arial, sans-serif" font-size="17" font-weight="400">
    <tspan x="610" dy="0">Chat: contexto de fila/pedido e feedback passam pelos módulos do backend.</tspan>
    <tspan x="610" dy="23.459999999999997">Catálogo e rastreio demonstrativos não chamam transportadoras reais.</tspan>
  </text>
  <text x="55" y="1370" fill="#19271f" font-family="Arial, sans-serif" font-size="20" font-weight="400">
    <tspan x="55" dy="0">Docker + Terraform: aplicação em localhost:8001, 1 worker; PostgreSQL e volume existentes importados e protegidos. .env montado somente para leitura.</tspan>
    <tspan x="55" dy="27.599999999999998">Somente prompts e contexto autorizado seguem para o Gemini; o PDF envia indicadores agregados. GenAI não altera pedidos nem o modelo.</tspan>
    <tspan x="55" dy="27.599999999999998">GenAI indisponível: consultas, ML e PDF de contingência continuam funcionando. Modo Python: porta 8000. Sem nuvem ou rastreamento real integrado.</tspan>
