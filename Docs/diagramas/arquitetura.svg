  <text x="1488" y="336" fill="#19271f" font-family="Arial, sans-serif" font-size="18" font-weight="400">Rotas /api/* e páginas do frontend</text>
  <text x="1488" y="361" fill="#19271f" font-family="Arial, sans-serif" font-size="18" font-weight="400">Sessão, perfil, CSRF e autorização</text>
  <text x="1488" y="386" fill="#19271f" font-family="Arial, sans-serif" font-size="18" font-weight="400">Cliente acessa apenas seus pedidos</text>
  <text x="1488" y="411" fill="#19271f" font-family="Arial, sans-serif" font-size="18" font-weight="400">Dashboard e PDF exclusivos do analista</text>
