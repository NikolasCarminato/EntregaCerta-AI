  <text x="2058" y="1136" fill="#19271f" font-family="Arial, sans-serif" font-size="18" font-weight="400">Chat e resumo de PDF</text>
  <text x="2058" y="1161" fill="#19271f" font-family="Arial, sans-serif" font-size="18" font-weight="400">Retentativas limitadas</text>
