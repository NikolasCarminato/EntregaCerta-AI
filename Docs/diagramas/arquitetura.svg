  <text x="1648" y="1111" fill="#19271f" font-family="Arial, sans-serif" font-size="18" font-weight="400">Análises/PDFs: TTL de 30 min</text>
  <text x="1648" y="1136" fill="#19271f" font-family="Arial, sans-serif" font-size="18" font-weight="400">Cache de modelo e de consultas</text>
  <text x="1648" y="1161" fill="#19271f" font-family="Arial, sans-serif" font-size="18" font-weight="400">Não são tabelas PostgreSQL</text>
