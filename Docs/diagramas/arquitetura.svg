  <text x="50" y="106" fill="#50604f" font-family="Arial, sans-serif" font-size="18" font-weight="400">
    <tspan x="50" dy="0">Estado implementado em 18/11/2026 • Aplicação local com FastAPI, frontend HTML/CSS/JS e PostgreSQL.</tspan>
    <tspan x="50" dy="24.839999999999996">Treinamento separado da execução web. A previsão histórica e os pedidos da loja demonstrativa são fluxos distintos.</tspan>
  </text>
