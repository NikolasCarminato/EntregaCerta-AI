  <rect x="600" y="610" width="420" height="235" rx="10" fill="#f0f5ed" stroke="#c7d5c5" stroke-width="1.5" />
  <text x="618" y="649" fill="#19271f" font-family="Arial, sans-serif" font-size="21" font-weight="700">Inferência histórica</text>
  <text x="618" y="686" fill="#19271f" font-family="Arial, sans-serif" font-size="18" font-weight="400">inferencia.py / catboost_ver07.py</text>
  <text x="618" y="711" fill="#19271f" font-family="Arial, sans-serif" font-size="18" font-weight="400">CatBoost: 111 atributos em D−1</text>
  <text x="618" y="736" fill="#19271f" font-family="Arial, sans-serif" font-size="18" font-weight="400">Só pendentes elegíveis recebem score</text>
  <text x="618" y="761" fill="#19271f" font-family="Arial, sans-serif" font-size="18" font-weight="400">Cota: ceil(65% × pendentes/dia)</text>
  <text x="618" y="786" fill="#19271f" font-family="Arial, sans-serif" font-size="18" font-weight="400">Score não é probabilidade calibrada</text>
